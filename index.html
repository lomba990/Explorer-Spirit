<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorer Spirit — Stories from Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ====== WARNA (boleh kamu ubah) ====== */
  :root {
    --navy: #131A3F; --cream: #FFF6E6; --orange: #FF8C42; --yellow: #FFD166; --soft: #C9D1F2;
    --bg-image: none;   /* foto latar sendiri: ganti none dengan url('background.jpg') */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--cream); font-family: 'Nunito', Arial, sans-serif;
    background-color: #070B1F;
    background-image: var(--bg-image),
      radial-gradient(ellipse at 15% 20%, rgba(120, 80, 200, .35), transparent 45%),
      radial-gradient(ellipse at 85% 75%, rgba(40, 160, 180, .28), transparent 50%),
      radial-gradient(ellipse at 60% 10%, rgba(255, 140, 66, .12), transparent 40%),
      radial-gradient(circle at 50% 50%, #131A3F 0%, #070B1F 80%);
    background-size: cover; background-attachment: fixed; background-position: center;
  }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .app { position: relative; z-index: 1; width: min(980px, 100%); margin: 0 auto; padding: 20px;
         display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 24px; }
  @media (max-width: 760px) { .app { grid-template-columns: minmax(0, 1fr); padding: 12px; } }

  /* ====== SPIRIT + ANIMASI ====== */
  .spirit-box { display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 8px; }
  .spirit-box h1 { font-family: 'Fredoka', Arial, sans-serif; margin: 0; font-size: 28px; color: var(--yellow); }
  .status { color: var(--soft); font-size: 15px; min-height: 22px; text-align: center; }
  .spirit { width: 240px; height: 240px; position: relative; animation: float 4s ease-in-out infinite; }
  @media (max-width: 760px) { .spirit-box .spirit { width: 160px; height: 160px; } }
  .spirit .body { width: 100%; height: 100%; transform-origin: 50% 90%; }
  .spirit img { width: 100%; height: 100%; object-fit: contain; display: block; transform-origin: 50% 90%;
                filter: drop-shadow(0 0 18px rgba(120,170,255,.35)); transition: filter .3s; }
  .spirit.talking .body { animation: talk .32s ease-in-out infinite alternate; }
  .spirit.talking img { filter: drop-shadow(0 0 30px rgba(140,200,255,.9)); }
  .spirit img.word { animation: word .16s ease-out; }
  .antenna { position: absolute; left: 50%; top: 8%; width: 26px; height: 26px; margin-left: -13px; border-radius: 50%;
             background: radial-gradient(circle, rgba(170,230,255,.95), rgba(170,230,255,0) 70%); opacity: 0; }
  .spirit.talking .antenna { animation: blink .5s ease-in-out infinite alternate; }
  .wave { display: flex; gap: 6px; height: 34px; align-items: center; opacity: .25; transition: opacity .3s; }
  .wave span { width: 8px; height: 8px; border-radius: 4px; background: var(--yellow); }
  .talking-wave { opacity: 1; }
  .talking-wave span { animation: bar .5s ease-in-out infinite alternate; }
  .talking-wave span:nth-child(2) { animation-delay: .1s; } .talking-wave span:nth-child(3) { animation-delay: .2s; }
  .talking-wave span:nth-child(4) { animation-delay: .3s; } .talking-wave span:nth-child(5) { animation-delay: .15s; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes talk  { from { transform: scale(1, 1); } to { transform: scale(1.03, .97) translateY(3px); } }
  @keyframes word  { 0% { transform: scale(1); } 50% { transform: scale(1.05, .95); } 100% { transform: scale(1); } }
  @keyframes blink { from { opacity: .2; } to { opacity: 1; } }
  @keyframes bar   { from { height: 6px; } to { height: 32px; } }

  /* ====== PANEL KANAN ====== */
  .panel { background: rgba(30, 42, 94, .82); backdrop-filter: blur(6px); border-radius: 28px; padding: 18px;
           border: 2px solid #34407A; min-height: 72vh; display: flex; flex-direction: column; gap: 12px; }
  .topbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .topbar .spacer { flex: 1; }
  .pill { font: 700 14px 'Nunito', Arial, sans-serif; border: 2px solid var(--yellow); color: var(--yellow);
          background: transparent; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .pill.on { background: var(--yellow); color: var(--navy); }
  .lang-select { padding-inline-end: 8px; max-width: 190px; }
  .lang-select option { color: var(--navy); background: var(--cream); }
  .voice-note { color: var(--yellow); font-size: 13px; text-align: center; max-width: 260px; }
  /* Bahasa Arab ditulis dari kanan ke kiri: ekor gelembung chat ikut dibalik */
  [dir="rtl"] .msg.kid { border-radius: 20px 20px 20px 6px; }
  [dir="rtl"] .msg.bot { border-radius: 20px 20px 6px 20px; }
  .mode-title { font: 700 20px 'Fredoka', Arial, sans-serif; color: var(--cream); }

  /* ====== MENU 3 TOMBOL ====== */
  .home { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 24px; text-align: center; }
  .home h2 { font: 700 30px 'Fredoka', Arial, sans-serif; margin: 0; color: var(--cream); }
  .worlds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 560px) { .worlds { grid-template-columns: minmax(0, 1fr); } }
  .world { background: rgba(19, 26, 63, .7); border: 2px solid #34407A; border-radius: 24px; padding: 18px 12px;
           color: var(--cream); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 10px;
           transition: transform .2s, border-color .2s, box-shadow .2s; font-family: 'Nunito', Arial, sans-serif; }
  .world:hover, .world:focus-visible { transform: translateY(-6px); border-color: var(--yellow); box-shadow: 0 10px 30px rgba(255,209,102,.25); outline: none; }
  .world svg { width: 120px; height: 120px; animation: spinSlow 30s linear infinite; }
  .world:nth-child(2) svg { animation-duration: 40s; } .world:nth-child(3) svg { animation: pulse 4s ease-in-out infinite; }
  .world b { font: 700 22px 'Fredoka', Arial, sans-serif; color: var(--yellow); }
  .world span { font-size: 14px; color: var(--soft); }
  @keyframes spinSlow { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }

  /* ====== CHAT ====== */
  .chat { flex: 1; display: none; flex-direction: column; gap: 12px; min-height: 0; }
  .messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 4px; max-height: 58vh; }
  .msg { max-width: 85%; padding: 12px 16px; line-height: 1.5; font-size: 17px; color: var(--navy); white-space: pre-wrap; }
  .msg.kid { align-self: flex-end; background: var(--orange); border-radius: 20px 20px 6px 20px; }
  .msg.bot { align-self: flex-start; background: var(--cream); border-radius: 20px 20px 20px 6px; }
  .msg img { display: block; width: 100%; max-width: 360px; border-radius: 12px; margin-top: 10px; }
  .credit { font-size: 13px; color: #4A4F6A; margin-top: 6px; }
  .label { display: inline-block; margin-top: 8px; font-size: 13px; font-weight: 700; color: #7a4a00;
           border: 2px solid #E0A93A; border-radius: 999px; padding: 2px 10px; }
  .label.general { color: #3d3f5c; border-color: #9aa0c3; border-style: dashed; }
  .composer { display: flex; gap: 8px; }
  .composer input { flex: 1; min-width: 0; font: 17px 'Nunito', Arial, sans-serif; padding: 12px 16px; border-radius: 999px; border: none; }
  .composer button { font: 700 17px 'Fredoka', Arial, sans-serif; border: none; border-radius: 999px; padding: 0 18px; cursor: pointer;
                     background: var(--yellow); color: var(--navy); }
  .composer button.mic.listening { background: var(--orange); animation: blink .6s infinite alternate; }
  .composer button:disabled { opacity: .5; cursor: wait; }
</style>
</head>

    <!-- Chat -->
    <div class="chat" id="chat">
      <div class="messages" id="messages"></div>
      <form class="composer" id="form">

        <input id="input" autocomplete="off" maxlength="300">
        <button type="submit" id="sendBtn"></button>
      </form>
    </div>
  </div>
</div>

   pitch 0.1–2 (tinggi nada), rate 0.5–2 (kecepatan)
   Kalau perangkat tidak punya suara untuk bahasa itu, Spirit hanya menulis (tidak bicara).
   ========================================================= */

const t = (k) => UI[lang][k] ?? UI.en[k];
const FIRST = { moon: "firstMoon", mars: "firstMars", explore: "firstExplore" };

/* ---------- Pesan di chat ---------- */
function addMessage(text, who, extra = {}) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;                       // textContent = aman, tidak menjalankan kode
  if (extra.image) {
    const img = document.createElement("img");
    img.src = extra.image.url; img.alt = extra.image.title || "NASA photo";
    img.onload = () => { $("messages").scrollTop = $("messages").scrollHeight; };
    div.appendChild(img);
    const c = document.createElement("div"); c.className = "credit";
    c.textContent = t("photo") + (extra.image.title ? " — " + extra.image.title : "");
    div.appendChild(c);
  }
  if (extra.label && extra.label !== "None") {
    const l = document.createElement("span"); l.className = "label";
    if (extra.label === "AI General Knowledge") { l.classList.add("general"); l.textContent = t("general"); }
    else l.textContent = t("source") + extra.label;
    div.appendChild(document.createElement("br")); div.appendChild(l);
  }
  $("messages").appendChild(div);
  $("messages").scrollTop = $("messages").scrollHeight;
}

/* =========================================================
   SUARA ROBOT — text-to-speech bawaan browser (GRATIS)
   ========================================================= */
let voices = [];
function loadVoices() { voices = speechSynthesis.getVoices(); updateVoiceNote(); }

function vLang(v) { return (v.lang || "").toLowerCase().replace(/_/g, "-"); }   // Android menulis "en_US"
function pickVoice() {
  const code = lang, locale = LANGS[lang].locale.toLowerCase();
  const prefixes = code === "zh" ? ["zh", "cmn"] : [code];
  const sameLang = voices.filter(v => prefixes.some(p => vLang(v) === p || vLang(v).startsWith(p + "-")));
  const want = VOICE[lang]?.voiceName;
  if (want) {
    const named = sameLang.find(v => new RegExp("\\b" + want + "\\b", "i").test(v.name));
    if (named) return named;                     // contoh: "Microsoft Mark - English (United States)"
  }
  // suara bawaan: utamakan logat yang sama (misal zh-CN, bukan zh-HK), suara Google (jernih), lalu default perangkat
  const exact = sameLang.filter(v => vLang(v) === locale);
  const pool = exact.length ? exact : sameLang;
  return pool.find(v => /google/i.test(v.name)) || pool.find(v => v.default) || pool[0] || null;
}
// Perangkat tidak punya suara untuk bahasa ini? Tampilkan catatan kecil, Spirit menjawab lewat tulisan saja.
function hasVoice() { return !voices.length || !!pickVoice(); }   // daftar suara kosong = biarkan browser memilih
function updateVoiceNote() { const n = $("voiceNote"); if (n) n.textContent = ("speechSynthesis" in window && !hasVoice()) ? t("noVoice") : ""; }
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

let audioCtx;
function beepBoop() {   // bunyi "bip-bup" sebelum bicara
  return new Promise((done) => {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      [[880, 0], [1320, 0.12]].forEach(([freq, at]) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = "sine"; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, now + at);
        g.gain.exponentialRampToValueAtTime(0.15, now + at + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now + at + 0.1);
        o.connect(g).connect(audioCtx.destination); o.start(now + at); o.stop(now + at + 0.11);
      });
      setTimeout(done, 280);
    } catch (e) { done(); }
  });
}

function startTalking() { spirit.classList.add("talking"); wave.classList.add("talking-wave"); }
function stopTalking()  { spirit.classList.remove("talking"); wave.classList.remove("talking-wave"); }
function wordPop() { spiritImg.classList.remove("word"); void spiritImg.offsetWidth; spiritImg.classList.add("word"); }

async function speak(text) {
  if (!voiceOn || !("speechSynthesis" in window) || !text) return;
  speechSynthesis.cancel();
  if (!hasVoice()) return;                                   // tidak ada suara bahasa ini: jangan dibaca dengan logat lain
  if (VOICE.beep) await beepBoop();
  // per kalimat (juga tanda baca Tionghoa/Jepang 。！？, Arab ؟, Hindi ।), supaya Chrome tidak berhenti di tengah
  const parts = text.match(/[^.!?…。！？؟।]+[.!?…。！？؟।]*/g) || [text];
  const voice = pickVoice(), set = VOICE[lang] || VOICE.en;
  startTalking();
  parts.forEach((p, i) => {
    const u = new SpeechSynthesisUtterance(p.trim());
    u.lang = LANGS[lang].locale;
    if (voice) u.voice = voice;
    u.pitch = set.pitch; u.rate = set.rate; u.volume = VOICE.volume;
    u.onboundary = (e) => { if (e.name === "word") wordPop(); };
    if (i === parts.length - 1) { u.onend = stopTalking; u.onerror = stopTalking; }
    speechSynthesis.speak(u);
  });
}

/* =========================================================
   MIKROFON (Chrome/Edge, GRATIS)
   ========================================================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (SR) {
  rec = new SR(); rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onresult = (e) => { $("input").value = e.results[0][0].transcript; $("form").requestSubmit(); };
  rec.onend = () => { $("micBtn").classList.remove("listening"); $("status").textContent = t("ready"); };
  rec.onerror = (e) => { console.warn("Mikrofon:", e.error); };   // misal bahasa ini tidak didukung pengenal suara
} else {
  $("micBtn").style.display = "none";
}
$("micBtn").onclick = () => {
  if (!rec) return;
  speechSynthesis.cancel(); stopTalking();
  // pakai logat perangkat kalau bahasanya sama (misal es-MX), kalau tidak pakai logat standar
  const dev = (navigator.language || "").replace(/_/g, "-");
  rec.lang = dev.toLowerCase().split("-")[0] === lang && dev.includes("-") ? dev : LANGS[lang].locale;
  $("micBtn").classList.add("listening"); $("status").textContent = t("listen");
  rec.start();
};

/* =========================================================
   MENU 3 TOMBOL → CHAT
   ========================================================= */
function openMode(m) {
  mode = m; history = [];
  $("messages").innerHTML = "";
  $("home").style.display = "none"; $("chat").style.display = "flex"; $("backBtn").style.display = "inline-block";
  $("modeTitle").textContent = t(m);
  const first = t(FIRST[m]);
  addMessage(first, "bot");
  history.push({ role: "spirit", text: first });
  speak(first);
  $("status").textContent = t("ready");
  $("input").focus();
}
function goHome() {
  mode = null; speechSynthesis.cancel(); stopTalking();
  $("chat").style.display = "none"; $("home").style.display = "flex"; $("backBtn").style.display = "none";
  $("modeTitle").textContent = ""; $("status").textContent = t("hello");
}
document.querySelectorAll(".world").forEach(b => b.onclick = () => openMode(b.dataset.mode));
$("backBtn").onclick = goHome;

/* ---------- Kirim pertanyaan → otak chatbot ---------- */
$("form").onsubmit = async (e) => {
  e.preventDefault();
  const question = $("input").value.trim();
  if (!question || !mode) return;
  addMessage(question, "kid");
  $("input").value = ""; $("sendBtn").disabled = true;
  $("status").textContent = t("think");
  const sentHistory = history.slice(-6);
  history.push({ role: "kid", text: question });
  try {
    const res = await fetch("/.netlify/functions/spirit", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, lang, mode, history: sentHistory })
    });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch (x) {   // bukan JSON = otak tidak ditemukan (404) atau dihentikan Netlify (timeout)
      data = { devError: `Server menjawab HTTP ${res.status} tanpa JSON. ` +
        (res.status === 404 ? "Otak chatbot (netlify/functions/spirit.mjs) tidak ditemukan. Cek menu Functions di Netlify."
         : res.status >= 500 ? "Kemungkinan otak chatbot error saat dimuat atau melewati batas 10 detik. Cek Logs > Functions di Netlify."
         : "") };
    }
    if (data.devError) {
      console.warn("Pesan untuk developer:", data.devError);   // lihat di Console (F12)
      if (DEBUG) addMessage("⚙️ Untuk developer: " + data.devError, "bot");
    }
    const answer = data.notice ? t(data.notice) : (data.answer || t("error"));   // notice = pesan tetap dalam bahasa pilihan
    addMessage(answer, "bot", { image: data.image, label: data.source_label });
    history.push({ role: "spirit", text: answer });
    speak(answer);
  } catch (err) {
    console.error(err);
    if (DEBUG) addMessage("⚙️ Untuk developer: koneksi gagal (" + err.message + ")", "bot");
    addMessage(t("error"), "bot");
  } finally {
    $("sendBtn").disabled = false; $("status").textContent = t("ready");
  }
};

/* ---------- Bahasa ---------- */
// Menu bahasa diisi dari daftar LANGS
for (const [code, L] of Object.entries(LANGS)) {
  const o = document.createElement("option"); o.value = code; o.textContent = L.name; o.lang = code;
  $("langSel").appendChild(o);
}
function setLang(l, remember) {
  if (!LANGS[l]) l = "en";
  const changed = l !== lang;
  lang = l;
  $("langSel").value = l;
  if (remember) { try { localStorage.setItem("spiritLang", l); } catch (e) {} }
  $("homeTitle").textContent = t("home");
  $("lblMoon").textContent = t("moon"); $("lblMars").textContent = t("mars"); $("lblExplore").textContent = t("explore");
  $("sub-moon").textContent = t("subMoon"); $("sub-mars").textContent = t("subMars"); $("sub-explore").textContent = t("subExplore");
  $("backBtn").textContent = t("back"); $("input").placeholder = t("placeholder"); $("sendBtn").textContent = t("send");
  $("micBtn").title = t("speak"); $("micBtn").setAttribute("aria-label", t("speak"));
  if (mode) $("modeTitle").textContent = t(mode); else $("status").textContent = t("hello");
  document.documentElement.lang = l;
  document.documentElement.dir = LANGS[l].rtl ? "rtl" : "ltr";
  updateVoiceNote();
  if (mode && changed) openMode(mode);   // sedang di chat? mulai ulang dengan sapaan dalam bahasa baru
}
// Bahasa awal: ?lang=xx di alamat > pilihan terakhir anak > bahasa perangkat (kalau AUTO_LANG) > English
function startLang() {
  const fromUrl = new URLSearchParams(location.search).get("lang");
  if (LANGS[fromUrl]) return fromUrl;
  try { const saved = localStorage.getItem("spiritLang"); if (LANGS[saved]) return saved; } catch (e) {}
  if (AUTO_LANG) {
    for (const d of navigator.languages || [navigator.language || ""]) {
      let c = String(d).toLowerCase().split(/[-_]/)[0];
      if (c === "in") c = "id";                 // kode lama Bahasa Indonesia di beberapa perangkat
      if (LANGS[c]) return c;
    }
  }
  return "en";
}
$("voiceBtn").onclick = () => {
  voiceOn = !voiceOn;
  if (!voiceOn) { speechSynthesis.cancel(); stopTalking(); }
  $("voiceBtn").classList.toggle("on", voiceOn); $("voiceBtn").textContent = voiceOn ? "🔊" : "🔇";
};
$("langSel").onchange = (e) => setLang(e.target.value, true);

/* =========================================================
   LANGIT BERBINTANG (bintang berkelip + bintang jatuh)
   ========================================================= */
const STAR_COUNT = 220;
const sky = $("sky"), ctx = sky.getContext("2d");
const calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
let stars = [], shooting = null, W = 0, H = 0;
function resizeSky() {
  const dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight; sky.width = W * dpr; sky.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  stars = Array.from({ length: STAR_COUNT }, () => ({
    x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.6 + 0.3,
    tw: Math.random() * Math.PI * 2, sp: 0.01 + Math.random() * 0.03, drift: 0.02 + Math.random() * 0.08,
  }));
}
function drawSky() {
  ctx.clearRect(0, 0, W, H);
  for (const s of stars) {
    if (!calm) { s.tw += s.sp; s.x -= s.drift; if (s.x < -2) s.x = W + 2; }
    ctx.globalAlpha = Math.max(0.08, 0.45 + Math.sin(s.tw) * 0.4); ctx.fillStyle = "#FFF6E6";
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }
  if (!calm) {
    if (!shooting && Math.random() < 0.004) shooting = { x: Math.random() * W * 0.7 + W * 0.3, y: Math.random() * H * 0.4, life: 1 };
    if (shooting) {
      const s = shooting, len = 120;
      const g = ctx.createLinearGradient(s.x, s.y, s.x + len, s.y - len * 0.4);
      g.addColorStop(0, "rgba(255,246,230," + s.life + ")"); g.addColorStop(1, "rgba(255,246,230,0)");
      ctx.globalAlpha = 1; ctx.strokeStyle = g; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + len, s.y - len * 0.4); ctx.stroke();
      s.x -= 9; s.y += 3.6; s.life -= 0.02; if (s.life <= 0) shooting = null;
    }
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(drawSky);
}
addEventListener("resize", resizeSky); resizeSky(); drawSky();

lang = null;   // supaya setLang pertama selalu menulis semua teks
setLang(startLang());
